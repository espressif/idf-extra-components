touch_element/test_apps/:
  enable:
    - if: IDF_TARGET in ["esp32s2", "esp32s3"]
  disable:
    - if: IDF_VERSION_MAJOR <= 5 and IDF_VERSION_MINOR < 3
      reason: IDF version below v5.3 is not supported

touch_element/examples/:
  enable:
    - if: IDF_TARGET in ["esp32s2", "esp32s3"]
  disable:
    - if: IDF_VERSION_MAJOR <= 5 and IDF_VERSION_MINOR < 3
      reason: IDF version below v5.3 is not supported
