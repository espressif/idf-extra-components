ccomp_timer/test_apps:
  disable_test:
    - if: IDF_TARGET == "esp32c3"
      temporary: true
      reason: "Preserve the previous CI runtime coverage; enable additional hardware targets after runner validation"
  enable:
    - if: IDF_TARGET in ["esp32", "esp32s2", "esp32c3"]
      reason: "Testing on these targets is sufficient (xtensa, risc-v, single/dual core)."
