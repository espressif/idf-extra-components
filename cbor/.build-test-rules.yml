cbor/host_test:
  enable:
    - if: IDF_TARGET == "linux"
  disable:
    - if: IDF_VERSION_MAJOR <= 5 and IDF_VERSION_MINOR < 5
      reason: test linux target on version >= 5.5 is sufficient

cbor/examples/cbor:
  enable:
    - if: IDF_TARGET in ["esp32s3", "esp32c3"]
      reason: "Sufficient to test on representative Xtensa and RISC-V targets"
