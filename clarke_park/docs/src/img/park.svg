<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>

  <text x="450" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2631">
    Park transform: the same vector, seen from the rotating rotor
  </text>

  <defs>
    <marker id="v-arrow" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a5276"/>
    </marker>
    <marker id="d-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7d3c98"/>
    </marker>
    <marker id="q-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/>
    </marker>
    <marker id="go-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2631"/>
    </marker>
  </defs>

  <!-- ============ left panel: stationary frame ============ -->
  <text x="240" y="72" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2631">Stationary frame (alpha / beta)</text>

  <!-- origin (240, 310) -->
  <line x1="62" y1="310" x2="418" y2="310" stroke="#95a5a6" stroke-width="1.5"/>
  <line x1="240" y1="130" x2="240" y2="440" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="422" y="315" font-size="13" fill="#5d6d7e">alpha</text>
  <text x="248" y="146" font-size="13" fill="#5d6d7e">beta</text>

  <!-- rotor axes: d at 30 deg, q at 120 deg -->
  <line x1="240" y1="310" x2="366" y2="237.3" stroke="#7d3c98" stroke-width="2.2" stroke-dasharray="7,4" marker-end="url(#d-arrow)"/>
  <text x="368" y="222" font-size="13" fill="#7d3c98">d axis</text>

  <line x1="240" y1="310" x2="179.6" y2="205.4" stroke="#b03a2e" stroke-width="2.2" stroke-dasharray="7,4" marker-end="url(#q-arrow)"/>
  <text x="146" y="200" font-size="13" fill="#b03a2e">q axis</text>

  <!-- V at 50 deg -->
  <line x1="240" y1="310" x2="314.7" y2="221.2" stroke="#1a5276" stroke-width="3.4" marker-end="url(#v-arrow)"/>
  <text x="288" y="196" font-size="16" font-weight="bold" fill="#1a5276">V</text>

  <!-- projections -->
  <line x1="240" y1="310" x2="314.7" y2="310" stroke="#1a5276" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="314.7" y1="310" x2="314.7" y2="221.2" stroke="#1a5276" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="242" y="350" font-size="14" fill="#1a5276">alpha</text>
  <text x="322" y="252" font-size="14" fill="#1a5276">beta</text>

  <!-- theta arc -->
  <path d="M 288 310 A 48 48 0 0 0 271.2 273.7" fill="none" stroke="#1b2631" stroke-width="1.7"/>
  <text x="286" y="304" font-size="12.5" font-style="italic" fill="#1b2631">theta</text>

  <text x="240" y="474" font-size="12.5" text-anchor="middle" fill="#5d6d7e">alpha / beta are fixed to the stator</text>

  <!-- arrow between panels -->
  <line x1="428" y1="272" x2="478" y2="272" stroke="#1b2631" stroke-width="2.2" marker-end="url(#go-arrow)"/>
  <text x="453" y="258" font-size="12" text-anchor="middle" fill="#1b2631">rotate</text>
  <text x="453" y="292" font-size="12" text-anchor="middle" fill="#1b2631">by -theta</text>

  <!-- ============ right panel: rotor frame ============ -->
  <text x="676" y="72" font-size="15" font-weight="bold" text-anchor="middle" fill="#1b2631">Rotor frame (d / q)</text>

  <!-- origin (676, 310) -->
  <line x1="498" y1="310" x2="854" y2="310" stroke="#95a5a6" stroke-width="1.5"/>
  <line x1="676" y1="130" x2="676" y2="440" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="858" y="315" font-size="13" fill="#5d6d7e">d</text>
  <text x="684" y="146" font-size="13" fill="#5d6d7e">q</text>

  <!-- d / q axes -->
  <line x1="676" y1="310" x2="802" y2="310" stroke="#7d3c98" stroke-width="2.2" stroke-dasharray="7,4" marker-end="url(#d-arrow)"/>
  <text x="800" y="340" font-size="13" fill="#7d3c98">d axis</text>

  <line x1="676" y1="310" x2="676" y2="200" stroke="#b03a2e" stroke-width="2.2" stroke-dasharray="7,4" marker-end="url(#q-arrow)"/>
  <text x="644" y="196" font-size="13" fill="#b03a2e">q axis</text>

  <!-- same V, now 20 deg above the d axis -->
  <line x1="676" y1="310" x2="789.4" y2="268.7" stroke="#1a5276" stroke-width="3.4" marker-end="url(#v-arrow)"/>
  <text x="794" y="262" font-size="16" font-weight="bold" fill="#1a5276">V</text>

  <!-- projections -->
  <line x1="676" y1="310" x2="789.4" y2="310" stroke="#1a5276" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="789.4" y1="310" x2="789.4" y2="268.7" stroke="#1a5276" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="700" y="336" font-size="14" fill="#1a5276">d</text>
  <text x="796" y="296" font-size="14" fill="#1a5276">q</text>

  <!-- small angle arc from d axis to V -->
  <path d="M 736 310 A 60 60 0 0 0 731.6 289.3" fill="none" stroke="#1b2631" stroke-width="1.7"/>
  <text x="716" y="336" font-size="11.5" font-style="italic" fill="#1b2631">theta - 30</text>

  <text x="676" y="474" font-size="12.5" text-anchor="middle" fill="#5d6d7e">d / q ride along with the rotor</text>

  <!-- formulas -->
  <text x="450" y="508" font-size="13" text-anchor="middle" font-style="italic" fill="#1b2631">
    d = alpha * cos(theta) + beta * sin(theta)          q = -alpha * sin(theta) + beta * cos(theta)
  </text>
  <text x="450" y="528" font-size="12.5" text-anchor="middle" fill="#5d6d7e">
    inverse Park: alpha = d * cos(theta) - q * sin(theta),  beta = d * sin(theta) + q * cos(theta)
  </text>
</svg>
