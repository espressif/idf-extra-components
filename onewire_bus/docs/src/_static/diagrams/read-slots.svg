<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#222">1-Wire read time slots &#8212; the slave decides the bit value</text>

  <!-- READ 1 -->
  <text x="20" y="74" font-size="13.5" font-weight="bold" fill="#1565c0">READ 1 &#8212; no device pulls low</text>
  <line x1="70" y1="96" x2="830" y2="96" stroke="#cfd8dc" stroke-width="1.2"/>
  <line x1="70" y1="156" x2="830" y2="156" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="20" y="100" font-size="11.5" fill="#555">HIGH</text>
  <text x="20" y="160" font-size="11.5" fill="#555">LOW</text>

  <polyline points="
      70,96
      110,96
      110,156
      140,156
      140,96
      330,96
      330,156
      360,156
      360,96
      830,96"
    fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round"/>

  <text x="146" y="88" font-size="12" fill="#1565c0">master only: short low start pulse</text>
  <line x1="140" y1="96" x2="140" y2="212" stroke="#ff8f00" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="146" y="212" font-size="12" fill="#ef6c00">&#9650; master samples &#8776; 15 &#181;s &#8594; HIGH &#8594; bit = 1</text>

  <g stroke="#607d8b" stroke-width="1.3" fill="none">
    <line x1="140" y1="182" x2="330" y2="182"/>
    <line x1="140" y1="176" x2="140" y2="188"/>
    <line x1="330" y1="176" x2="330" y2="188"/>
  </g>
  <text x="196" y="176" font-size="12" fill="#37474f">slot window t_SLOT</text>

  <!-- READ 0 -->
  <text x="20" y="286" font-size="13.5" font-weight="bold" fill="#1565c0">READ 0 &#8212; device holds the line low</text>
  <line x1="70" y1="308" x2="830" y2="308" stroke="#cfd8dc" stroke-width="1.2"/>
  <line x1="70" y1="368" x2="830" y2="368" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="20" y="312" font-size="11.5" fill="#555">HIGH</text>
  <text x="20" y="372" font-size="11.5" fill="#555">LOW</text>

  <polyline points="
      70,368
      110,368
      110,308
      140,308
      140,368
      260,368
      260,308
      360,308
      360,368
      430,368
      430,308
      830,308"
    fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round"/>

  <text x="146" y="300" font-size="12" fill="#1565c0">master start pulse</text>

  <line x1="140" y1="308" x2="140" y2="392" stroke="#ff8f00" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="146" y="392" font-size="12" fill="#ef6c00">&#9650; master samples &#8776; 15 &#181;s &#8594; LOW &#8594; bit = 0</text>

  <g stroke="#c62828" stroke-width="1.3" fill="none">
    <line x1="140" y1="416" x2="330" y2="416"/>
    <line x1="140" y1="410" x2="140" y2="422"/>
    <line x1="330" y1="410" x2="330" y2="422"/>
  </g>
  <text x="146" y="436" font-size="12" fill="#c62828">device pulls LOW, then releases before the slot ends</text>

  <!-- time axis -->
  <line x1="70" y1="428" x2="830" y2="428" stroke="#666" stroke-width="1.4" marker-end="url(#arr3)"/>
  <text x="800" y="422" font-size="12" fill="#666">time</text>
</svg>
