<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="340" fill="#ffffff"/>

  <!-- axis labels -->
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#222">1-Wire reset pulse and presence pulse</text>

  <text x="20" y="60" font-size="12" fill="#555">HIGH</text>
  <text x="20" y="130" font-size="12" fill="#555">LOW</text>

  <!-- level guides -->
  <line x1="70" y1="56" x2="830" y2="56" stroke="#cfd8dc" stroke-width="1.2"/>
  <line x1="70" y1="126" x2="830" y2="126" stroke="#cfd8dc" stroke-width="1.2"/>

  <!-- waveform : idle high, reset low, release, device presence low, high -->
  <polyline points="
      70,56
      150,56
      150,126
      300,126
      300,56
      360,56
      360,126
      470,126
      470,56
      830,56"
    fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round"/>

  <!-- vertical time markers -->
  <g stroke="#b0bec5" stroke-width="1" stroke-dasharray="4 4">
    <line x1="150" y1="126" x2="150" y2="290"/>
    <line x1="300" y1="56"  x2="300" y2="290"/>
    <line x1="360" y1="126" x2="360" y2="290"/>
    <line x1="470" y1="56"  x2="470" y2="290"/>
  </g>

  <!-- duration measures -->
  <g stroke="#e53935" stroke-width="1.4" fill="none">
    <line x1="150" y1="160" x2="300" y2="160"/>
    <line x1="150" y1="154" x2="150" y2="166"/>
    <line x1="300" y1="154" x2="300" y2="166"/>
  </g>
  <text x="152" y="180" font-size="12.5" fill="#c62828">t_RESET ≥ 480 µs  (master pulls LOW)</text>

  <g stroke="#e53935" stroke-width="1.4" fill="none">
    <line x1="300" y1="196" x2="360" y2="196"/>
    <line x1="300" y1="190" x2="300" y2="202"/>
    <line x1="360" y1="190" x2="360" y2="202"/>
  </g>
  <text x="368" y="200" font-size="12.5" fill="#c62828">t_PDH 15..60 µs (master waits)</text>

  <g stroke="#2e7d32" stroke-width="1.4" fill="none">
    <line x1="360" y1="232" x2="470" y2="232"/>
    <line x1="360" y1="226" x2="360" y2="238"/>
    <line x1="470" y1="226" x2="470" y2="238"/>
  </g>
  <text x="368" y="252" font-size="12.5" fill="#1b5e20">t_PDL 60..240 µs (slave pulls LOW → presence)</text>

  <!-- annotations -->
  <text x="155" y="112" font-size="12" fill="#1565c0">master drives LOW</text>
  <text x="500" y="44" font-size="12" fill="#1565c0">pull-up returns bus HIGH</text>
  <text x="372" y="148" font-size="12" fill="#1b5e20">device present</text>

  <!-- bottom axis -->
  <line x1="70" y1="290" x2="830" y2="290" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="790" y="310" font-size="12" fill="#666">time</text>
  <text x="76" y="310" font-size="12" fill="#666">idle</text>
</svg>
