name: Reusable - Build and run a Unity test app for one target/version

# Builds a central Unity test app (test_app/) with plain
# `idf.py build` for ONE (idf_target, idf_ver) pair and, as soon as that
# build is done, runs it on matching hardware. Callers drive one matrix
# instance per pair, so each test run only waits for its own build.

on:
  workflow_call:
    inputs:
      idf_ver:
        description: ESP-IDF version (docker tag of espressif/idf)
        required: true
        type: string
      idf_target:
        description: ESP-IDF target to build for and (optionally) run on
        required: true
        type: string
      test_dir:
        description: Directory of the test app (e.g. test_app)
        required: true
        type: string
      binary_name:
        description: Base name of the built binary (e.g. idf_extra_test_app)
        required: true
        type: string
      run_test:
        description: Run the app on hardware after building it
        required: false
        type: boolean
        default: true
      runner_labels:
        description: JSON array of runner labels for the hardware test job
        required: false
        type: string
        default: ''
      pytest_args:
        description: Arguments passed to pytest (already interpolated by the caller)
        required: false
        type: string
        default: ''
      extra_pip_packages:
        description: Additional packages to install next to pytest-embedded
        required: false
        type: string
        default: ''
      results_artifact_name:
        description: If set, upload JUnit XML results under this artifact name
        required: false
        type: string
        default: ''
      results_path:
        description: Glob path of the JUnit XML files to upload
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ inputs.test_dir }} (${{ inputs.idf_target }}, ${{ inputs.idf_ver }})
    runs-on: ubuntu-latest
    container: espressif/idf:${{ inputs.idf_ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: $/.github/actions/setup-idf-build-env
        with:
          install_python_tools: 'false'
      - name: Build test app
        env:
          IDF_TARGET: ${{ inputs.idf_target }}
        shell: bash
        working-directory: ${{ inputs.test_dir }}
        run: |
          . ${IDF_PATH}/export.sh
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary_name }}_bin_${{ inputs.idf_target }}_${{ inputs.idf_ver }}
          path: |
            ${{ inputs.test_dir }}/build/bootloader/bootloader.bin
            ${{ inputs.test_dir }}/build/partition_table/partition-table.bin
            ${{ inputs.test_dir }}/build/${{ inputs.binary_name }}.bin
            ${{ inputs.test_dir }}/build/${{ inputs.binary_name }}.elf
            ${{ inputs.test_dir }}/build/flasher_args.json

  run-target:
    name: Run ${{ inputs.test_dir }} on ${{ inputs.idf_target }} (${{ inputs.idf_ver }})
    if: ${{ github.repository_owner == 'espressif' && inputs.run_test }}
    needs: build
    uses: ./.github/workflows/reusable-target-test.yml
    with:
      idf_target: ${{ inputs.idf_target }}
      runner_labels: ${{ inputs.runner_labels }}
      artifact_pattern: ${{ inputs.binary_name }}_bin_${{ inputs.idf_target }}_${{ inputs.idf_ver }}
      artifact_download_path: ${{ inputs.test_dir }}/build
      pytest_args: ${{ inputs.pytest_args }}
      working_directory: ${{ inputs.test_dir }}
      extra_pip_packages: ${{ inputs.extra_pip_packages }}
      results_artifact_name: ${{ inputs.results_artifact_name }}
      results_path: ${{ inputs.results_path }}
