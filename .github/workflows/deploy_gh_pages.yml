name: Build and Deploy Programming Guides

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for docs (default: latest for master, pr-preview-N for PR)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mdBook 📥
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: Install mdbook plugins 🧩
        run: |
          set -euo pipefail
          # mdbook-mermaid is a preprocessor: it must stay on PATH so that
          # build_docs.py can run "mdbook-mermaid install" before "mdbook build".
          cargo install mdbook-mermaid --locked

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/tools/requirements-docs.txt

      - name: Install doxygen tools 🧱
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y doxygen
          python3 -m pip install --upgrade pip
          python3 -m pip install -r .github/tools/requirements-docs.txt

      - name: Build docs 🔧
        env:
          DOCS_VERSION: ${{ github.event.inputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version="${DOCS_VERSION:-}"
          if [[ -z "$version" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              version="pr-preview-${PR_NUMBER}"
            else
              version="latest"
            fi
          fi
          # The default is to build every component and report all failures at the end.
          python3 ./.github/tools/build_docs.py --version "$version" --output-dir "docs_build_output"

      - name: Check Links 🔍
        uses: lycheeverse/lychee-action@v2
        with:
          # Check links in docs_build_output
          args: >-
            --no-progress
            --include-fragments
            --root-dir docs_build_output
            --exclude-path '.*/404\.html$'
            docs_build_output/**/*.html
          # Fail the action if broken links are found
          fail: true

      # Create directory structure for GitHub Pages with "version prefix"
      - name: Prepare files for deployment 📁
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          version="latest"
          mkdir -p "gh-pages/$version"
          cp -r docs_build_output/* "gh-pages/$version/"

      - name: Upload Pages artifact 📤
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Upload docs artifact for PR review 📦
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-pr-${{ github.event.pull_request.number }}
          path: docs_build_output
          retention-days: 7
          if-no-files-found: error

      - name: Generate build summary 📝
        if: always()
        env:
          STATUS: ${{ job.status }}
          # pull_request refs are refs/pull/<n>/merge; head_ref is the source branch
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "## Docs Build Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Status** | $STATUS |"
            echo "| **Event** | $GITHUB_EVENT_NAME |"
            echo "| **Branch** | $BRANCH |"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "| **PR** | #$PR_NUMBER |"
            fi
            echo "| **Commit** | $COMMIT |"
            echo "| **By** | $ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}latest/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Pages 📥
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Generate deploy summary 📝
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Docs Deploy Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Status** | ${{ job.status }} |"
            echo "| **Event** | ${{ github.event_name }} |"
            echo "| **Environment** | github-pages |"
            echo "| **URL** | ${{ steps.deployment.outputs.page_url }}latest/ |"
          } >> "$GITHUB_STEP_SUMMARY"
