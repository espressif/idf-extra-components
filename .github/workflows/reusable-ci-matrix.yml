name: Reusable - CI matrix

# Reads .github/ci-matrix.json and exposes it as workflow outputs so that
# caller workflows can build their strategy.matrix from a single source of truth.
#
# Usage in a caller workflow:
#   jobs:
#     ci-matrix:
#       uses: ./.github/workflows/reusable-ci-matrix.yml
#     build:
#       needs: ci-matrix
#       strategy:
#         matrix:
#           idf_ver: ${{ fromJSON(needs.ci-matrix.outputs.idf_versions) }}

on:
  workflow_call:
    outputs:
      idf_versions:
        description: JSON array of ESP-IDF versions to build with
        value: ${{ jobs.read-matrix.outputs.idf_versions }}
      idf_versions_target_test:
        description: JSON array of ESP-IDF versions to run the test app with
        value: ${{ jobs.read-matrix.outputs.idf_versions_target_test }}
      idf_versions_ethernet_test:
        description: JSON array of ESP-IDF versions to run Ethernet examples with
        value: ${{ jobs.read-matrix.outputs.idf_versions_ethernet_test }}
      idf_versions_linux_test:
        description: JSON array of ESP-IDF versions to run Linux-target apps with
        value: ${{ jobs.read-matrix.outputs.idf_versions_linux_test }}
      idf_targets:
        description: JSON array of targets with per-target build-and-test pipelines
        value: ${{ jobs.read-matrix.outputs.idf_targets }}
      parallel_indices:
        description: JSON array of build shard indices (1..parallel_count from .idf_build_apps.toml)
        value: ${{ jobs.read-matrix.outputs.parallel_indices }}
      parallel_count:
        description: Number of build shards (parallel_count from .idf_build_apps.toml)
        value: ${{ jobs.read-matrix.outputs.parallel_count }}

jobs:
  read-matrix:
    runs-on: ubuntu-latest
    outputs:
      idf_versions: ${{ steps.matrix.outputs.idf_versions }}
      idf_versions_target_test: ${{ steps.matrix.outputs.idf_versions_target_test }}
      idf_versions_ethernet_test: ${{ steps.matrix.outputs.idf_versions_ethernet_test }}
      idf_versions_linux_test: ${{ steps.matrix.outputs.idf_versions_linux_test }}
      idf_targets: ${{ steps.matrix.outputs.idf_targets }}
      parallel_indices: ${{ steps.matrix.outputs.parallel_indices }}
      parallel_count: ${{ steps.matrix.outputs.parallel_count }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          {
            echo "idf_versions=$(jq -c '.idf_versions' .github/ci-matrix.json)"
            echo "idf_versions_target_test=$(jq -c '.idf_versions_target_test' .github/ci-matrix.json)"
            echo "idf_versions_ethernet_test=$(jq -c '.idf_versions_ethernet_test' .github/ci-matrix.json)"
            echo "idf_versions_linux_test=$(jq -c '.idf_versions_linux_test' .github/ci-matrix.json)"
            echo "idf_targets=$(jq -c '.idf_targets' .github/ci-matrix.json)"
            echo "parallel_indices=$(jq -c '[range(1; .parallel_count + 1)]' .github/ci-matrix.json)"
            echo "parallel_count=$(jq -c '.parallel_count' .github/ci-matrix.json)"
          } >> "$GITHUB_OUTPUT"
