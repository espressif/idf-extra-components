name: Reusable - CI for one ESP-IDF version

# Public entry point. The caller owns version selection and event policy.
# Every invocation discovers, builds and tests in its own ESP-IDF environment.
on:
  workflow_call:
    inputs:
      idf_version:
        description: Docker tag of espressif/idf
        required: true
        type: string
      run_tests:
        description: Enable runtime tests on the configured runners
        type: boolean
        default: false
      modified_files:
        description: JSON array of changed files; empty means no file filter
        type: string
        default: '[]'
      modified_components:
        description: JSON array of changed components; empty means no component filter
        type: string
        default: '[]'
      pipeline_id:
        description: Unique artifact namespace if the same IDF version is called more than once
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IDF_CI_TOOLS_PATH: .github/ci-source/.github/actions/ci-tools

jobs:
  check:
    name: check_test_scripts_build_test_rules
    runs-on: ubuntu-22.04
    outputs:
      report_url: ${{ steps.upload.outputs.artifact-url }}
    container: espressif/idf:${{ inputs.idf_version }}
    steps:
      - &checkout-sources
        uses: actions/checkout@v5
        # Only build jobs compile submodule sources; they initialize them in a
        # separate step (anchor defined in the build job below).
      # Fetch helpers from this workflow's revision, not the caller's checkout.
      # Remote action staging follows dangling submodule symlinks in this repo.
      - &save-ci-helpers
        name: Cache CI helpers
        # The check job saves; every other job restores and falls back to the
        # sparse checkout below on a miss (same cost as before caching).
        uses: actions/cache@v5
        id: ci-helpers
        with:
          key: ci-helpers-${{ job.workflow_sha }}
          path: .github/ci-source
      - &checkout-ci-helpers
        name: Checkout shared CI helpers
        if: steps.ci-helpers.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/ci-source
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - &install-collection-tools
        name: Install collection tools
        run: |
          . "${IDF_PATH}/export.sh"
          pip install -r "$IDF_CI_TOOLS_PATH/requirements.txt"
      - name: Compare build configurations and pytest cases
        # Missing build definitions fail; unexplained build-only variants warn.
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/check_test_coverage.py" --output check_test_scripts_build_test_rules.html
      - name: Upload check_test_scripts_build_test_rules report
        id: upload
        if: always() && hashFiles('check_test_scripts_build_test_rules.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: check_test_scripts_build_test_rules_${{ inputs.pipeline_id || inputs.idf_version }}
          path: |
            check_test_scripts_build_test_rules.html
            check_test_scripts_build_test_rules.json
          if-no-files-found: error

  generate:
    name: Discover build candidates
    needs: check
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ inputs.idf_version }}
    outputs:
      build_matrix: ${{ steps.gen.outputs.build_matrix }}
      has_builds: ${{ steps.gen.outputs.has_builds }}
    steps:
      - *checkout-sources
      - &restore-ci-helpers
        name: Restore CI helpers
        uses: actions/cache/restore@v5
        id: ci-helpers
        with:
          key: ci-helpers-${{ job.workflow_sha }}
          path: .github/ci-source
      - *checkout-ci-helpers
      - *install-collection-tools
      - name: Generate build matrix
        id: gen
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/generate_build_matrix.py"

  build:
    name: Build ${{ matrix.idf_target }} (shard ${{ matrix.parallel_index }}/${{ matrix.parallel_count }})
    needs: generate
    if: needs.generate.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.build_matrix) }}
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ inputs.idf_version }}
    steps:
      - *checkout-sources
      - &init-submodules
        name: Init submodules (shallow, cached, with retry)
        # Restores the cache populated by the caller's 'submodules' job and
        # materializes working trees from it without network access; on a
        # miss fetches shallow, in parallel, with retries.
        uses: espressif/esp-idf-projects-ci-action@feat/build-test-pipeline
      - *restore-ci-helpers
      - *checkout-ci-helpers
      - name: Install ESP-IDF Python environment
        run: |
          export IDF_PYTHON_CHECK_CONSTRAINTS=yes
          "${IDF_PATH}/install.sh" --enable-ci
      - uses: ./.github/ci-source/.github/actions/setup-idf-build-env
        with:
          target: ${{ matrix.idf_target }}
      - name: Build apps
        env:
          IDF_TARGET_NAME: ${{ matrix.idf_target }}
          # Expressions convert the structured inputs into idf-build-apps'
          # semicolon-separated format; $MODIFIED_ARGS expands unquoted into
          # whole words. ESP-IDF project paths must not contain whitespace.
          MODIFIED_ARGS: >-
            ${{ inputs.modified_files != '[]' && format('--modified-files {0}', join(fromJSON(inputs.modified_files), ';')) || '' }}
            ${{ inputs.modified_components != '[]' && format('--modified-components {0}', join(fromJSON(inputs.modified_components), ';')) || '' }}
        run: |
          . "${IDF_PATH}/export.sh"
          idf-build-apps build --target "$IDF_TARGET_NAME" \
            --parallel-index ${{ matrix.parallel_index }} --parallel-count ${{ matrix.parallel_count }} \
            --collect-app-info "build_info_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.json" \
            $MODIFIED_ARGS
      - name: Upload build results
        if: always() && hashFiles(format('build_info_{0}_{1}.json', matrix.idf_target, matrix.parallel_index)) != ''
        uses: actions/upload-artifact@v6
        with:
          name: build_info_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_${{ matrix.parallel_index }}
          path: build_info_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.json
          if-no-files-found: error
      - name: Package runtime artifacts
        id: package
        if: inputs.run_tests
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/package_binaries.py" build_info_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.json app_binaries_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.tar
      - uses: actions/upload-artifact@v6
        if: inputs.run_tests && steps.package.outputs.has_binaries == 'true'
        with:
          name: app_binaries_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_${{ matrix.parallel_index }}
          path: app_binaries_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.tar
          if-no-files-found: error

  build-report:
    name: Build report
    outputs:
      report_url: ${{ steps.upload.outputs.artifact-url }}
    needs: [generate, build]
    # Also report failed and build-only runs; never turn missing data into success.
    if: always() && needs.generate.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - *restore-ci-helpers
      - *checkout-ci-helpers
      - name: Download build results
        if: needs.generate.outputs.has_builds == 'true'
        # Render the missing-shard diagnostics even if the download fails.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: build_info_${{ inputs.pipeline_id || inputs.idf_version }}_*
          path: ci-build-results
          merge-multiple: true
      - name: Generate HTML report
        env:
          BUILD_MATRIX: ${{ needs.generate.outputs.build_matrix }}
          IDF_VERSION: ${{ inputs.idf_version }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          python3 "$IDF_CI_TOOLS_PATH/generate_build_report.py" ci-build-results build-report.html --idf-version "$IDF_VERSION" --build-result "$BUILD_RESULT"
      - name: Upload HTML report
        id: upload
        if: always() && hashFiles('build-report.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: build_report_${{ inputs.pipeline_id || inputs.idf_version }}
          path: build-report.html
          if-no-files-found: error

  plan-tests:
    name: Plan tests from build results
    needs: [generate, build]
    if: inputs.run_tests
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ inputs.idf_version }}
    outputs:
      test_matrix: ${{ steps.gen.outputs.test_matrix }}
      has_tests: ${{ steps.gen.outputs.has_tests }}
    steps:
      - *checkout-sources
      - *restore-ci-helpers
      - *checkout-ci-helpers
      - *install-collection-tools
      - name: Download build results
        uses: actions/download-artifact@v7
        with:
          pattern: build_info_${{ inputs.pipeline_id || inputs.idf_version }}_*
          path: ci-build-results
          merge-multiple: true
      - name: Generate test matrix
        id: gen
        env:
          BUILD_MATRIX: ${{ needs.generate.outputs.build_matrix }}
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/generate_test_matrix.py" ci-build-results
      - name: Upload test selection
        uses: actions/upload-artifact@v6
        with:
          name: test_selection_${{ inputs.pipeline_id || inputs.idf_version }}
          path: test-selection.json

  test:
    # Full runner labels in the name: queued jobs reveal their runner pool.
    name: Test ${{ matrix.idf_target }} (${{ matrix.marker }}) [${{ join(matrix.runner_labels, ', ') }}]
    needs: plan-tests
    if: needs.plan-tests.outputs.has_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-tests.outputs.test_matrix) }}
    env:
      TEST_RESULT_NAME: test_results_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_${{ strategy.job-index }}
      TEST_RESULT_FILE: test_results.xml
      IDF_TARGET_NAME: ${{ matrix.idf_target }}
    runs-on: ${{ matrix.runner_labels }}
    container:
      image: ${{ matrix.execution == 'linux' && 'python:3.14-slim-trixie' || 'python:3.11-bookworm' }}
      options: ${{ matrix.execution != 'linux' && '--privileged' || '' }}
    steps:
      - name: Ensure Git is available for sparse checkout
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git
          fi
      - uses: actions/checkout@v5
      - *restore-ci-helpers
      - *checkout-ci-helpers
      - uses: actions/download-artifact@v7
        with:
          pattern: app_binaries_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_*
          merge-multiple: true
      - name: Restore runtime artifacts
        run: |
          for archive in app_binaries_*.tar; do
            tar -xf "$archive"
          done
      - name: Restore pip cache
        # pip's cache is content-addressed, so restore-keys across requirement
        # changes are safe and warm the cache from previous runs.
        uses: actions/cache@v5
        with:
          key: test-pip-${{ matrix.execution == 'linux' && 'py3.14' || 'py3.11' }}-${{ hashFiles('.github/ci-source/.github/actions/ci-tools/requirements.txt') }}
          path: ~/.cache/pip
          restore-keys: test-pip-${{ matrix.execution == 'linux' && 'py3.14' || 'py3.11' }}-
      - name: Install Python packages
        env:
          PIP_EXTRA_INDEX_URL: https://dl.espressif.com/pypi/
        run: pip install --prefer-binary -r "$IDF_CI_TOOLS_PATH/requirements.txt"
      - name: Restore QEMU cache
        # Keep the extracted emulator between runs. Key must stay in sync with
        # QEMU_VERSION/QEMU_DATE in setup_qemu.sh; on miss the script downloads.
        if: matrix.execution == 'qemu'
        id: qemu-cache
        uses: actions/cache@v5
        with:
          path: qemu
          key: qemu-${{ runner.arch }}-9.2.2-20250817-${{ matrix.idf_target }}
      - name: Setup QEMU
        if: matrix.execution == 'qemu'
        run: |
          . "$IDF_CI_TOOLS_PATH/setup_qemu.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Record test environment
        continue-on-error: true
        run: |
          mkdir -p ci-test-logs
          python3 -m pip list --format=json > ci-test-logs/packages.json
          python3 -m serial.tools.list_ports -v > ci-test-logs/ports-before.txt 2>&1
      - name: Run apps
        id: run_apps
        env:
          TEST_NODES: ${{ matrix.nodes }}
          PYTEST_ARGS: >-
            --embedded-services ${{ matrix.execution == 'qemu' && 'idf,qemu' || matrix.execution == 'linux' && 'idf' || 'esp,idf' }}
            --root-logdir=ci-test-logs/embedded --log-file=ci-test-logs/pytest-debug.log --log-file-level=DEBUG
        run: |
          mkdir -p ci-test-logs
          # The planner supplies one node ID per line; mapfile splits on
          # newlines only, so node IDs may contain spaces.
          mapfile -t nodes <<< "$TEST_NODES"
          # bash runs with pipefail: tee must not hide pytest's exit status.
          # --target all matches test discovery; --target linux would inject an
          # extra parameter and change the planned node IDs.
          pytest "${nodes[@]}" \
            --ignore-glob '*/managed_components/*' --ignore=.github \
            --junit-xml "$TEST_RESULT_FILE" --target all \
            --build-dir "build_${IDF_TARGET_NAME}" \
            $PYTEST_ARGS 2>&1 | tee ci-test-logs/pytest.log
      - name: Record serial ports after failure
        if: failure() && steps.run_apps.outcome == 'failure'
        continue-on-error: true
        run: python3 -m serial.tools.list_ports -v > ci-test-logs/ports-after.txt 2>&1
      - name: Record test result context
        if: always()
        env:
          REPORT_IDF_VERSION: ${{ inputs.idf_version }}
          REPORT_TARGET: ${{ matrix.idf_target }}
          REPORT_MARKER: ${{ matrix.marker }}
          REPORT_JOB_RESULT: ${{ job.status }}
          REPORT_RUN_RESULT: ${{ steps.run_apps.outcome }}
          REPORT_RUNNER: ${{ runner.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          context = {key: os.environ.get('REPORT_' + key.upper(), '')
                     for key in ('idf_version', 'target', 'marker', 'job_result', 'run_result', 'runner')}
          Path('test-context.json').write_text(json.dumps(context))
          PY
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ env.TEST_RESULT_NAME }}
          path: |
            ${{ env.TEST_RESULT_FILE }}
            test-context.json
      - name: Upload test diagnostics
        uses: actions/upload-artifact@v6
        if: always() && steps.run_apps.outcome == 'failure'
        with:
          name: test_diagnostics_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_${{ strategy.job-index }}
          path: |
            ci-test-logs/
            test-context.json
          if-no-files-found: warn

  version-report:
    name: Results (${{ inputs.idf_version }})
    needs: [check, generate, build, build-report, plan-tests, test]
    # One summary after all stages, including build-only and failed pipelines.
    if: always()
    runs-on: ubuntu-22.04
    env:
      REPORT_TESTS: ${{ inputs.run_tests && needs.plan-tests.result == 'success' && needs.plan-tests.outputs.has_tests == 'true' }}
    steps:
      - *restore-ci-helpers
      - *checkout-ci-helpers
      - name: Download this version's test results
        if: env.REPORT_TESTS == 'true'
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: test_results_${{ inputs.pipeline_id || inputs.idf_version }}_*
          path: ci-test-results
      - name: Generate HTML report
        if: env.REPORT_TESTS == 'true'
        id: render
        env:
          IDF_VERSION: ${{ inputs.idf_version }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          python3 "$IDF_CI_TOOLS_PATH/generate_test_report.py" ci-test-results test-report.html \
            --idf-version "$IDF_VERSION" --pipeline-result "$TEST_RESULT" --markdown test-summary.md
      - name: Upload HTML report
        id: upload
        if: always() && hashFiles('test-report.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: test_report_${{ inputs.pipeline_id || inputs.idf_version }}
          path: test-report.html
          if-no-files-found: error
      - name: Summarize this IDF version
        if: always()
        env:
          IDF_VERSION: ${{ inputs.idf_version }}
          CHECK_RESULT: ${{ needs.check.result }}
          DISCOVERY_RESULT: ${{ needs.generate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_REPORT_RESULT: ${{ needs.build-report.result }}
          PLAN_RESULT: ${{ needs.plan-tests.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_REPORT_RESULT: ${{ steps.render.outcome == 'success' && steps.upload.outcome || steps.render.outcome }}
          CHECK_REPORT_URL: ${{ needs.check.outputs.report_url }}
          BUILD_URL: ${{ needs.build-report.outputs.report_url }}
          TEST_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            printf '## ESP-IDF %s\n\n' "$IDF_VERSION"
            printf '| Stage | Status |\n| --- | --- |\n'
            printf '| check_test_scripts_build_test_rules | %s |\n' "$CHECK_RESULT"
            printf '| Build discovery | %s |\n' "$DISCOVERY_RESULT"
            printf '| Builds | %s |\n' "$BUILD_RESULT"
            printf '| Build report | %s |\n' "$BUILD_REPORT_RESULT"
            printf '| Test planning | %s |\n' "$PLAN_RESULT"
            printf '| Tests | %s |\n' "$TEST_RESULT"
            printf '| Test report | %s |\n\n' "$TEST_REPORT_RESULT"
            if [ -n "$CHECK_REPORT_URL" ]; then printf -- '- [check_test_scripts_build_test_rules](%s)\n' "$CHECK_REPORT_URL"; fi
            if [ -n "$BUILD_URL" ]; then printf -- '- [Build report](%s)\n' "$BUILD_URL"; fi
            if [ -n "$TEST_URL" ]; then printf -- '- [Test report](%s)\n' "$TEST_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Append test summary
        # Show failures directly in the job summary; the HTML artifact stays the detailed report.
        if: always() && hashFiles('test-summary.md') != ''
        run: cat test-summary.md >> "$GITHUB_STEP_SUMMARY"
