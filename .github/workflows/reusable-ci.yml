name: Reusable - CI for one ESP-IDF version

# Public entry point. The caller owns version selection and event policy.
# Every invocation discovers, builds and tests in its own ESP-IDF environment.
on:
  workflow_call:
    inputs:
      idf_version:
        description: Docker tag of espressif/idf
        required: true
        type: string
      run_tests:
        description: Enable runtime tests on the configured runners
        type: boolean
        default: false
      modified_files:
        description: JSON array of changed files; empty means no file filter
        type: string
        default: '[]'
      modified_components:
        description: JSON array of changed components; empty means no component filter
        type: string
        default: '[]'
      pipeline_id:
        description: Unique artifact namespace if the same IDF version is called more than once
        type: string
        default: ''

permissions:
  contents: read

jobs:
  generate:
    name: Discover build candidates
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ inputs.idf_version }}
    outputs:
      build_matrix: ${{ steps.gen.outputs.build_matrix }}
      has_builds: ${{ steps.gen.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      # Fetch helpers from this workflow's revision, not the caller's checkout.
      # Remote action staging follows dangling submodule symlinks in this repo.
      - name: Checkout shared CI helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/ci-source
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/ci-source/.github/actions/ci-tools
      - name: Install collection tools
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh"
          pip install -r "$IDF_CI_TOOLS_PATH/requirements.txt"
      - name: Generate build matrix
        id: gen
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/generate_build_matrix.py"

  build:
    name: Build ${{ matrix.idf_target }} (shard ${{ matrix.parallel_index }}/${{ matrix.parallel_count }})
    needs: generate
    if: needs.generate.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.build_matrix) }}
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ inputs.idf_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      # Fetch helpers from this workflow's revision, not the caller's checkout.
      # Remote action staging follows dangling submodule symlinks in this repo.
      - name: Checkout shared CI helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/ci-source
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/ci-source/.github/actions/ci-tools
      - name: Install ESP-IDF Python environment
        shell: bash
        run: |
          export IDF_PYTHON_CHECK_CONSTRAINTS=yes
          "${IDF_PATH}/install.sh" --enable-ci
      - uses: ./.github/ci-source/.github/actions/setup-idf-build-env
        with:
          target: ${{ matrix.idf_target }}
      - name: Build apps
        shell: bash
        env:
          MODIFIED_FILES: ${{ inputs.modified_files }}
          MODIFIED_COMPONENTS: ${{ inputs.modified_components }}
          IDF_TARGET_NAME: ${{ matrix.idf_target }}
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/run_build.py" --target "$IDF_TARGET_NAME" --parallel-index ${{ matrix.parallel_index }} --parallel-count ${{ matrix.parallel_count }} --build-info build_info_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.json
      - name: Upload build results
        if: inputs.run_tests
        uses: actions/upload-artifact@v4
        with:
          name: build_info_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_${{ matrix.parallel_index }}
          path: build_info_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.json
          if-no-files-found: error
      - name: Package runtime artifacts
        id: package
        if: inputs.run_tests
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/package_binaries.py" --skip-empty build_info_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.json app_binaries_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.tar
      - uses: actions/upload-artifact@v4
        if: inputs.run_tests && steps.package.outputs.has_binaries == 'true'
        with:
          name: app_binaries_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_${{ matrix.parallel_index }}
          path: app_binaries_${{ matrix.idf_target }}_${{ matrix.parallel_index }}.tar
          if-no-files-found: error

  plan-tests:
    name: Plan tests from build results
    needs: [generate, build]
    if: inputs.run_tests
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ inputs.idf_version }}
    outputs:
      test_matrix: ${{ steps.gen.outputs.test_matrix }}
      has_tests: ${{ steps.gen.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      # Fetch helpers from this workflow's revision, not the caller's checkout.
      # Remote action staging follows dangling submodule symlinks in this repo.
      - name: Checkout shared CI helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/ci-source
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/ci-source/.github/actions/ci-tools
      - name: Install collection tools
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh"
          pip install -r "$IDF_CI_TOOLS_PATH/requirements.txt"
      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          pattern: build_info_${{ inputs.pipeline_id || inputs.idf_version }}_*
          path: ci-build-results
          merge-multiple: true
      - name: Generate test matrix
        id: gen
        shell: bash
        env:
          BUILD_MATRIX: ${{ needs.generate.outputs.build_matrix }}
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "$IDF_CI_TOOLS_PATH/generate_test_matrix.py" ci-build-results

  test:
    name: Test ${{ matrix.idf_target }} (${{ matrix.marker }})
    needs: plan-tests
    if: needs.plan-tests.outputs.has_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-tests.outputs.test_matrix) }}
    env:
      TEST_RESULT_NAME: test_results_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_${{ matrix.id }}
      TEST_RESULT_FILE: test_results.xml
    runs-on: ${{ matrix.runner_labels }}
    container:
      image: ${{ matrix.idf_target == 'linux' && 'python:3.14-slim-trixie' || 'python:3.11-bookworm' }}
      options: ${{ matrix.idf_target != 'linux' && '--privileged' || '' }}
    steps:
      - name: Ensure Git is available for sparse checkout
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git
          fi
      - uses: actions/checkout@v4
      # Fetch helpers from this workflow's revision, not the caller's checkout.
      # Remote action staging follows dangling submodule symlinks in this repo.
      - name: Checkout shared CI helpers
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github/ci-source
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/ci-source/.github/actions/ci-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: app_binaries_${{ inputs.pipeline_id || inputs.idf_version }}_${{ matrix.idf_target }}_*
          merge-multiple: true
      - name: Restore runtime artifacts
        shell: bash
        run: |
          for archive in app_binaries_*.tar; do
            tar -xf "$archive"
          done
      - name: Install Python packages
        env:
          PIP_EXTRA_INDEX_URL: https://dl.espressif.com/pypi/
        run: pip install --prefer-binary -r "$IDF_CI_TOOLS_PATH/requirements-test.txt"
      - name: Setup QEMU
        if: matrix.setup_qemu
        shell: bash
        run: |
          . "$IDF_CI_TOOLS_PATH/setup_qemu.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - name: Run apps
        shell: bash
        env:
          IDF_TARGET_NAME: ${{ matrix.idf_target }}
          TEST_NODES: ${{ toJSON(matrix.nodes) }}
          PYTEST_ARGS: ${{ matrix.pytest_args }}
        run: |
          python3 "$IDF_CI_TOOLS_PATH/run_tests.py" --target "$IDF_TARGET_NAME" --junit-xml "$TEST_RESULT_FILE"
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.TEST_RESULT_NAME }}
          path: ${{ env.TEST_RESULT_FILE }}
