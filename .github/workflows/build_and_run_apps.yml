name: Build and Run Apps

on:
  schedule:
    - cron: '0 0 * * *' # Once per day at midnight
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - master

# A newer commit supersedes older work on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The pipeline lives in espressif/esp-idf-projects-ci-action so every
  # ESP-IDF component project runs the same revisioned CI. This caller owns
  # only triggers and concurrency; the permission block is the superset the
  # called jobs narrow individually.
  pipeline:
    name: CI pipeline
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    uses: espressif/esp-idf-projects-ci-action/.github/workflows/build_and_run_apps.yml@feat/build-test-pipeline

  # Single stable status check intended for branch protection. The called
  # workflow's own gate reports as 'CI pipeline / CI Gate'; this wrapper
  # keeps the exact 'CI Gate' check name that branch protection requires.
  ci-gate:
    name: CI Gate
    if: always()
    needs: pipeline
    runs-on: ubuntu-22.04
    steps:
      - name: Check pipeline result
        run: |
          test "${{ needs.pipeline.result }}" != "failure" && test "${{ needs.pipeline.result }}" != "cancelled"
