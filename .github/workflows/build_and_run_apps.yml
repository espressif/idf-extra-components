name: Build and Run Apps

on:
  schedule:
    - cron: '0 0 * * *' # Once per day at midnight
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - master

# A newer commit supersedes older work on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare pipeline
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test_all_apps: ${{ steps.get_labels.outputs.test_all_apps }}
      build_only: ${{ steps.get_labels.outputs.build_only }}
      has_changes: ${{ steps.find_changes.outputs.has_changes }}
      modified_files: ${{ steps.find_changes.outputs.modified_files }}
      modified_components: ${{ steps.find_changes.outputs.modified_components }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Test CI matrix generation
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - name: Fix git repo permissions
        # Needed by the next git diff step.
        # See https://github.com/actions/runner/issues/2033
        if: github.event_name == 'pull_request'
        run: |
          build_dir=$PWD
          cd /
          git config --global --add safe.directory $build_dir
          cd -
      - name: Read caller version matrix
        id: matrix
        run: echo "matrix=$(jq -c . .github/ci-matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Get labels
        id: get_labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        # Check for labels
        # "PR: test all apps"
        # "PR: build only"
        run: |
          gh api --jq '.labels.[].name' /repos/{owner}/{repo}/pulls/${{ github.event.number }} > labels.txt
          test_all_apps=$(grep -c 'PR: test all apps' labels.txt || true)
          build_only=$(grep -c 'PR: build only' labels.txt || true)
          echo "test_all_apps=$test_all_apps" >> $GITHUB_OUTPUT
          echo "build_only=$build_only" >> $GITHUB_OUTPUT
          echo "test_all_apps=$test_all_apps"
          echo "build_only=$build_only"

      - name: Find changed files and components
        id: find_changes
        if: github.event_name == 'pull_request' && steps.get_labels.outputs.test_all_apps == '0'
        # - based on the files list, determine which components have changed
        # - pass structured selection data to the reusable workflow
        run: |
          git fetch --recurse-submodules=no origin ${{ github.base_ref }}:base_ref
          git fetch --recurse-submodules=no origin pull/${{ github.event.pull_request.number }}/head:pr_ref
          git diff --name-only -r base_ref pr_ref > changed_files.txt
          python3 .github/get_ci_changes.py changed_files.txt

  # Pre-check, like esp-idf's check_test_scripts_build_test_rules: fails when
  # a test script's target parametrization disagrees with the component's
  # .build-test-rules.yml manifest.
  check:
    name: Check test scripts vs build-test rules
    runs-on: ubuntu-22.04
    container: espressif/idf:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: $/.github/actions/ci-tools
      - name: Install dependencies
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          pip install -r "$IDF_CI_TOOLS_PATH/requirements.txt"
      - name: Check test scripts
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          python3 "$IDF_CI_TOOLS_PATH/check_test_scripts.py"

  # Each matrix entry invokes the same complete pipeline for one IDF version.
  ci:
    name: CI (${{ matrix.idf_version }})
    needs: prepare
    if: github.event_name != 'pull_request' || needs.prepare.outputs.test_all_apps == '1' || needs.prepare.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/reusable-ci.yml
    with:
      idf_version: ${{ matrix.idf_version }}
      config_file: .github/ci-config.json
      test_profile: ${{ matrix.test_profile }}
      run_tests: ${{ github.repository_owner == 'espressif' && needs.prepare.outputs.build_only != '1' }}
      modified_files: ${{ needs.prepare.outputs.modified_files || '[]' }}
      modified_components: ${{ needs.prepare.outputs.modified_components || '[]' }}

  publish-results:
    name: Publish Test results
    needs:
      - prepare
      - ci
    if: github.repository_owner == 'espressif' && always() && github.event_name == 'pull_request' && needs.prepare.outputs.build_only == '0' && (needs.prepare.outputs.test_all_apps == '1' || needs.prepare.outputs.has_changes == 'true')
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download Test results
        uses: actions/download-artifact@v4
        with:
          pattern: test_results_*
          path: test_results
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test_results/**/*.xml
          # Fork and Dependabot PRs have read-only tokens; keep their job summary.
          check_run: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          comment_mode: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && 'always' || 'off' }}

  # Single stable status check intended for branch protection: it always
  # runs, and fails when any job failed or was cancelled. Skipped jobs
  # (e.g. the version pipelines on CI-only PRs) count as success.
  # Require ONLY this check in branch protection - matrix job names change
  # whenever the matrix changes and must not be required directly.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [prepare, check, ci, publish-results]
    runs-on: ubuntu-22.04
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          results = {name: job['result'] for name, job in json.loads(os.environ['NEEDS']).items()}
          for name, result in sorted(results.items()):
              print(f'{name}: {result}')
          failed = {name: result for name, result in results.items() if result in ('failure', 'cancelled')}
          if failed:
              raise SystemExit(f'Failed jobs: {failed}')
          EOF
