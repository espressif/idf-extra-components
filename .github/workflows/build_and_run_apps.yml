name: Build and Run Apps

on:
  schedule:
    - cron: '0 0 * * *' # Once per day at midnight
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - master

# A newer commit supersedes older work on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The pipeline lives in espressif/esp-idf-projects-ci-action so every
  # ESP-IDF component project runs the same revisioned CI. This caller owns
  # only triggers, concurrency and the SDK version list; the permission
  # block is the superset the called jobs narrow individually. Branch
  # protection requires the called workflow's stable gate, reported with
  # this job's name as prefix: 'CI pipeline / CI Gate'.
  pipeline:
    name: CI pipeline
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    uses: espressif/esp-idf-projects-ci-action/.github/workflows/build_and_run_apps.yml@feat/build-test-pipeline
    with:
      idf_versions: '["release-v5.3", "release-v5.4", "release-v5.5", "release-v6.0", "release-v6.1", "latest"]'
