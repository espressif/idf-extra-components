[pytest]
# only the files with prefix `pytest_` would be recognized as pytest test scripts.
python_files = pytest_*.py

markers =
  disable_test(condition=None, targets=None, configs=None, reason=...): deselect variants matching an optional positional IDF boolean expression and target/config selectors

# set traceback to "short" to prevent the overwhelming tracebacks
addopts =
  -s -vv
  --embedded-services esp,idf
  --tb short

# markers that select the runner environment (used by idf-ci to group test
# cases into per-runner CI jobs); the idf-ci pytest plugin registers these
# as markers automatically
env_markers =
  generic: generic runner
  ethernet: ethernet runners
  spi_nand_flash: runner with SPI NAND flash connected
  qemu: QEMU runner
  quad_psram: runner with Quad PSRAM
  usb_serial_jtag: USB Serial/JTAG console runners

# ignore PytestExperimentalApiWarning for record_xml_attribute
filterwarnings =
  ignore::_pytest.warning_types.PytestExperimentalApiWarning

# log related
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
# junit related
junit_family = xunit1
## log all to `system-out` when case fail
junit_logging = system-out
junit_log_passing_tests = False
