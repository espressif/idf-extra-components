iqmath/host_test:
  enable:
    - if: IDF_TARGET == "linux"
  disable:
    - if: IDF_VERSION_MAJOR <= 5 and IDF_VERSION_MINOR < 5
      reason: test linux target on version >= 5.5 is sufficient

iqmath/examples/get_started:
  disable_test:
    - if: IDF_TARGET in ["esp32c3", "esp32c5"]
      temporary: true
      reason: "Preserve the previous CI runtime coverage; enable additional hardware targets after runner validation"
  enable:
    - if: IDF_TARGET in ["esp32", "esp32s3", "esp32c3", "esp32c5"]
      reason: "Sufficient to test on representative Xtensa and RISC-V targets"
