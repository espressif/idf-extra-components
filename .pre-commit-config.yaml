repos:
-   repo: https://github.com/igrr/astyle_py.git
    rev: v1.1.0
    hooks:
    -   id: astyle_py
        args: ['--astyle-version=3.4.7', '--rules=astyle-rules.yml']
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell
-   repo: local
    hooks:
    -   id: consistency_check
        name: Repo consistency checks
        language: python
        entry: python .github/consistency_check.py
        pass_filenames: false
        additional_dependencies:
            - "toml; python_version < '3.11'"
            - pyyaml
    -   id: esp_schedule_port_isolation
        name: esp_schedule default-port isolation
        language: python
        entry: python esp_schedule/check_port_isolation.py
        pass_filenames: false
        files: '^esp_schedule/(src|include|port)/.*\.[ch]$'
-   repo: https://github.com/espressif/esp-idf-kconfig.git
    rev: v2.5.0
    hooks:
    -   id: check-kconfig-files
    -   id: check-deprecated-kconfig-options
